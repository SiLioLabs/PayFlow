# Use the GNU toolchain's self-contained linker and dlltool when building
# tests locally on Windows without a full Visual Studio installation.
# CI uses ubuntu-latest so this block is a no-op there.
[target.x86_64-pc-windows-gnu]
linker = "C:\\Users\\HP\\.rustup\\toolchains\\stable-x86_64-pc-windows-gnu\\lib\\rustlib\\x86_64-pc-windows-gnu\\bin\\self-contained\\x86_64-w64-mingw32-gcc.exe"
rustflags = ["-C", "default-linker-libraries=no"]

[env]
# Expose the self-contained dlltool so the backtrace build script can find it.
DLLTOOL = "C:\\Users\\HP\\.rustup\\toolchains\\stable-x86_64-pc-windows-gnu\\lib\\rustlib\\x86_64-pc-windows-gnu\\bin\\self-contained\\dlltool.exe"
AR_x86_64_pc_windows_gnu = "C:\\Users\\HP\\.rustup\\toolchains\\stable-x86_64-pc-windows-gnu\\lib\\rustlib\\x86_64-pc-windows-gnu\\bin\\self-contained\\x86_64-w64-mingw32-gcc.exe"
