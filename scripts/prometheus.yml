# Prometheus configuration for the PayFlow local observability stack.
# Loaded by the prometheus service in docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    app: payflow
    env: local

# Alert rules
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    # No alertmanager in the local dev stack.
    # Add one here for production use.
    []

scrape_configs:
  - job_name: "payflow-keeper"
    static_configs:
      - targets:
          - "keeper:9091"
    metrics_path: /metrics
    scrape_interval: 15s
