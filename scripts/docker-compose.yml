# PayFlow local observability stack
#
# docker compose up
#
# Services:
#   keeper      — PayFlow keeper service (charges subscriptions)
#   prometheus  — scrapes keeper metrics on :9091/metrics
#   grafana     — pre-provisioned with the PayFlow dashboard
#
# Ports (all bound to 127.0.0.1 — local-only by default):
#   localhost:9091  → keeper /metrics
#   localhost:9090  → Prometheus UI
#   localhost:3000  → Grafana UI  (admin / admin — change on first login)
#
# Quick start:
#   cp scripts/.env.example scripts/.env
#   # Edit .env — set CONTRACT_ID and KEEPER_SECRET_FILE or KEEPER_SECRET
#   docker compose -f scripts/docker-compose.yml up
#
# Docker secret (recommended for mainnet):
#   echo "SXXXXXXXX..." > /run/secrets/keeper_secret
#   Set KEEPER_SECRET_FILE=/run/secrets/keeper_secret in .env

version: "3.9"

networks:
  payflow:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:
  # ── Keeper ────────────────────────────────────────────────────────────────
  keeper:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.keeper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      METRICS_PORT: "9091"
    ports:
      # Metrics — local only
      - "127.0.0.1:9091:9091"
    networks:
      - payflow
    # Mount a Docker secret for the signing key (preferred over env var)
    # secrets:
    #   - keeper_secret
    # Uncomment and adjust if using Docker secrets:
    # volumes:
    #   - /run/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Prometheus UI — local only
      - "127.0.0.1:9090:9090"
    networks:
      - payflow
    depends_on:
      keeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Only allow access from localhost
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Grafana UI — local only
      - "127.0.0.1:3000:3000"
    networks:
      - payflow
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Docker secrets (uncomment to use file-based secret for mainnet)
# secrets:
#   keeper_secret:
#     file: /run/secrets/keeper_secret
services:
  keeper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: payflow-keeper:latest
    container_name: payflow-keeper

    # Load all keeper configuration from a local .env file.
    # Copy scripts/.env.example to scripts/.env and fill in the values.
    # The .env file is never baked into the image.
    env_file:
      - .env

    # Restart the container automatically unless it was explicitly stopped.
    restart: unless-stopped

    # Resource limits — keeper is lightweight; cap to avoid runaway memory on
    # unexpected SDK bugs.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

    # Write structured JSON logs to a rotating file alongside stdout so they
    # survive container restarts without a dedicated log shipper.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Shared volume for the SQLite event DB written by indexer.ts.
    volumes:
      - events-data:/app/data

    # Graceful shutdown: give the keeper up to 60 s to finish its current
    # charge page before Docker sends SIGKILL.
    stop_grace_period: 60s

    # Health check: RPC getHealth endpoint (inherited from Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"${RPC_URL:-https://soroban-testnet.stellar.org}\" --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' --header='Content-Type: application/json' | grep -q '\"status\":\"healthy\"'"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: payflow-keeper:latest
    container_name: payflow-indexer

    # Override CMD to run the indexer instead of keeper.
    command: ["tsx", "indexer.ts"]

    # Load all configuration from a local .env file.
    env_file:
      - .env

    # Indexer should run continuously; restart unless explicitly stopped.
    restart: unless-stopped

    # Resource limits — indexer is lightweight; cap to avoid runaway memory.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

    # Structured JSON logs with rotation.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Shared volume for SQLite event DB — indexer writes events.db here.
    volumes:
      - events-data:/app/data

    # Graceful shutdown: allow indexer to finish current poll and close DB.
    stop_grace_period: 30s

    # Health check: RPC getHealth endpoint (inherited from Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"${RPC_URL:-https://soroban-testnet.stellar.org}\" --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' --header='Content-Type: application/json' | grep -q '\"status\":\"healthy\"'"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3

  metrics:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: payflow-keeper:latest
    container_name: payflow-metrics

    # Override CMD to run the metrics server instead of keeper.
    command: ["tsx", "metrics-server.ts"]

    # Load all configuration from a local .env file.
    env_file:
      - .env

    # Metrics server should run continuously; restart unless explicitly stopped.
    restart: unless-stopped

    # Resource limits — metrics server is very lightweight.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

    # Structured JSON logs with rotation.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Expose metrics port for Prometheus scraping.
    ports:
      - "${METRICS_PORT:-9090}:9090"

    # Graceful shutdown: stop the HTTP server cleanly.
    stop_grace_period: 10s

    # Health check: verify the HTTP server is responding.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  events-data:
    driver: local
