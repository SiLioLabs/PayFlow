name: Contract CI

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "vesting/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "contract/**"
      - "vesting/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract.yml"

jobs:
  contract:
    name: fmt · clippy · test · wasm-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ── Format ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        working-directory: contract
        run: cargo fmt --all -- --check

      # ── Clippy (warnings are errors) ─────────────────────────────────────
      - name: cargo clippy
        run: cargo clippy --locked --workspace -- -D warnings

      # ── Unit / integration tests ─────────────────────────────────────────
      - name: cargo test
        run: cargo test --locked --workspace

      # ── WASM release build ───────────────────────────────────────────────
      - name: Build deployable WASM
        run: |
          if ! cargo info stellar-cli@30.0.0 --quiet; then
            echo "::warning::Stellar CLI 30 is unavailable. SDK 30 WASM packaging was skipped."
            exit 0
          fi
          cargo install --locked stellar-cli --version 30.0.0
          stellar contract build --package flowpay
          stellar contract build --package academy-vesting

      # ── Snapshot check ───────────────────────────────────────────────────
      - name: Set up Node.js for snapshot check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run snapshot check
        working-directory: contract
        run: node scripts/snapshot-check.mjs
