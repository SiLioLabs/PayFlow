name: Contract CI

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"

jobs:
  contract:
    name: fmt · clippy · test · wasm-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ── Format ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        working-directory: contract
        run: cargo fmt --all -- --check

      # ── Clippy (warnings are errors) ─────────────────────────────────────
      - name: cargo clippy
        working-directory: contract
        run: cargo clippy -- -D warnings

      # ── Unit / integration tests ─────────────────────────────────────────
      - name: cargo test
        working-directory: contract
        run: cargo test

      # ── WASM release build ───────────────────────────────────────────────
      - name: cargo build --release (wasm)
        working-directory: contract
        run: cargo build --release --target wasm32-unknown-unknown

      # ── Snapshot check ───────────────────────────────────────────────────
      - name: Set up Node.js for snapshot check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install snapshot-check dependencies
        working-directory: contract
        run: npm ci

      - name: Run snapshot check
        working-directory: contract
        run: node scripts/snapshot-check.mjs
