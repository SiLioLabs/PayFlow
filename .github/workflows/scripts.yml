name: Scripts

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths:
      - "scripts/**"
      - "docs/**"

defaults:
  run:
    working-directory: scripts

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint duplicates
        run: npm run lint:duplicates
      - name: Smoke test config
        run: npm run smoke:config
      - name: Run tests
        run: npm run test
