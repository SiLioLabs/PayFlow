name: Secret Scanning

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify-no-secrets:
    name: Verify No Secret Files Committed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for testnet-accounts.json
        run: |
          if find . -name "testnet-accounts.json" -not -path "./.git/*" -not -name "*.example.json" | grep -q .; then
            echo "❌ ERROR: testnet-accounts.json found in repository!"
            echo "This file should be gitignored and generated locally."
            echo "Found files:"
            find . -name "testnet-accounts.json" -not -path "./.git/*" -not -name "*.example.json"
            exit 1
          else
            echo "✅ No testnet-accounts.json files found (correct)"
          fi

      - name: Verify .gitignore contains secret patterns
        run: |
          if ! grep -q "testnet-accounts.json" .gitignore; then
            echo "❌ ERROR: .gitignore missing testnet-accounts.json pattern"
            exit 1
          fi
          if ! grep -q "*.local.json" .gitignore; then
            echo "❌ ERROR: .gitignore missing *.local.json pattern"
            exit 1
          fi
          echo "✅ .gitignore properly configured"

      - name: Check for Stellar secret keys in code
        run: |
          # Look for potential Stellar secret keys (S followed by 55 alphanumeric chars)
          # Exclude example files, documentation, and this CI script itself
          if grep -r -n "S[A-Z0-9]\{55\}" \
            --exclude="*.example.*" \
            --exclude="*.md" \
            --exclude="*.yml" \
            --exclude="*.yaml" \
            --exclude=".gitleaks.toml" \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir="target" \
            . | grep -v "SXXXXXXX"; then
            echo "⚠️  WARNING: Potential Stellar secret keys detected!"
            echo "Review the above matches. If they are real secrets, remove them immediately."
            exit 1
          fi
          echo "✅ No obvious secret keys found in source code"
