name: Scripts CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Typecheck
        run: npm run typecheck
        working-directory: scripts

      - name: Lint
        run: npm run lint
        working-directory: scripts

      - name: Lint duplicates (baseline check)
        run: npm run lint:duplicates
        working-directory: scripts

      - name: Lint duplicates (direct)
        run: node lint-duplicates.mjs
        working-directory: scripts

      - name: Test
        run: npm test
        working-directory: scripts
        env:
          NODE_OPTIONS: --experimental-sqlite
