name: Docs

# Runs documentation freshness and consistency checks.
#
# check-error-codes: verifies that every numeric code defined in
# contract/src/errors.rs has a corresponding row in the
# docs/ERROR-CODES.md quick-reference table AND a "### N —" recovery
# section.  This prevents the doc from silently drifting when a new
# ContractError variant is added to the contract.

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "contract/src/errors.rs"
      - "scripts/check-error-codes.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "docs/**"
      - "contract/src/errors.rs"
      - "scripts/check-error-codes.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  error-codes-sync:
    name: ERROR-CODES.md ↔ errors.rs parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check ERROR-CODES.md is in sync with errors.rs
        run: node scripts/check-error-codes.mjs
