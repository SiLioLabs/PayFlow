name: Documentation checks

on:
    pull_request:
    push:
        branches: [master]

jobs:
    docs-and-config-drift:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run check:env-docs
            - run: node check-doc-links.mjs
